name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # the generated api types must match what openapi-typescript makes from the committed schema
      - run: pnpm exec openapi-typescript types/openapi.json -o types/api.ts && git diff --exit-code types/api.ts

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          # a throwaway database inside the job, so no password at all
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: finsight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/finsight_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . ../../evals
      - run: uv run ruff format --check . ../../evals
      - run: uv run pyright . ../../evals
      - run: uv run pytest -q
      # no AI keys in CI, so this runs the parsing suite only
      - run: uv run python ../../evals/run.py --ci
      # the web app's schema copy must match the API, or `pnpm api:types` wasn't run
      - run: uv run python -m scripts.openapi > /tmp/openapi.json && diff -u ../web/types/openapi.json /tmp/openapi.json
